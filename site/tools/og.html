<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og</title>
<style>
	@font-face { font-family: 'Geist Variable'; font-weight: 100 900; src: url('../assets/fonts/geist-latin-wght-normal.woff2') format('woff2-variations'); }
	@font-face { font-family: 'Geist Mono Variable'; font-weight: 100 900; src: url('../assets/fonts/geist-mono-latin-wght-normal.woff2') format('woff2-variations'); }
	:root {
		--background: oklch(12% 0.01 292);
		--foreground: oklch(98.5% 0 0);
		--muted-foreground: oklch(72% 0.012 292);
		--border: oklch(24% 0.012 292);
		--primary: oklch(70% 0.2 292.717);
		--glow: oklch(60% 0.26 292.717 / 0.3);
	}
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		position: relative;
		background: var(--background);
		color: var(--foreground);
		font-family: 'Geist Variable', sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	.grid, .glow { position: absolute; inset: 0; }
	.grid {
		background-image: radial-gradient(var(--border) 1.5px, transparent 1.5px);
		background-size: 22px 22px;
		mask-image: radial-gradient(70% 90% at 20% 30%, #000 20%, transparent 75%);
	}
	.glow { background: radial-gradient(55% 70% at 18% 20%, var(--glow), transparent 70%); }
	.copy { position: absolute; left: 72px; top: 92px; width: 470px; }
	.logo { width: 88px; height: 88px; filter: drop-shadow(0 14px 30px oklch(50% 0.25 292 / 0.45)); }
	h1 { margin-top: 36px; font-size: 76px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
	h1 span { color: var(--primary); }
	p { margin-top: 22px; font-size: 27px; line-height: 1.38; color: var(--muted-foreground); letter-spacing: -0.01em; }
	.url { position: absolute; left: 72px; bottom: 64px; font-family: 'Geist Mono Variable', monospace; font-size: 20px; color: var(--muted-foreground); }
	.shot {
		position: absolute; left: 600px; top: 96px; width: 760px;
		border-radius: 16px; overflow: hidden;
		border: 1px solid oklch(30% 0.02 292);
		box-shadow: 0 30px 80px -10px oklch(0% 0 0 / 0.7), 0 0 0 1px oklch(100% 0 0 / 0.03);
	}
	.shot img { display: block; width: 100%; }
</style>
</head>
<body>
	<div class="grid"></div>
	<div class="glow"></div>
	<div class="copy">
		<img class="logo" src="../../docs/logo.svg" alt="" />
		<h1>octo<span>·</span>modern</h1>
		<p>A modern, self-hosted UI for every OctoPrint printer you run.</p>
	</div>
	<div class="url">vitafortis.github.io/octo-modern</div>
	<div class="shot"><img src="../../docs/screenshots/printer.png" alt="" /></div>
</body>
</html>
