<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#0b0a10" />
		<title>Offline · octo·modern</title>
		<link rel="icon" href="/icon-192.png" />
		<!-- Served by the service worker when the server can't be reached; self-contained. -->
		<style>
			:root {
				--background: oklch(99% 0.005 292);
				--foreground: oklch(14.5% 0 0);
				--card: oklch(100% 0 0);
				--muted-foreground: oklch(52% 0.01 292);
				--border: oklch(90% 0.01 292);
				--primary: oklch(58% 0.26 292.717);
				--primary-solid-top: oklch(54% 0.18 292);
				--primary-solid-bottom: oklch(48% 0.18 292);
				--primary-solid-edge: oklch(42% 0.15 292);
				--shadow: 0 1px 2px oklch(0% 0 0 / 0.05), 0 8px 24px -12px oklch(0% 0 0 / 0.12);
			}
			:root[data-theme='dark'] {
				--background: oklch(12% 0.01 292);
				--foreground: oklch(98.5% 0 0);
				--card: oklch(14.5% 0.012 292);
				--muted-foreground: oklch(64% 0.012 292);
				--border: oklch(22% 0.012 292);
				--primary: oklch(65% 0.24 292.717);
				--primary-solid-top: oklch(54% 0.15 292);
				--primary-solid-bottom: oklch(47% 0.15 292);
				--primary-solid-edge: oklch(40% 0.12 292);
				--shadow: 0 1px 2px oklch(0% 0 0 / 0.4), 0 8px 24px -12px oklch(0% 0 0 / 0.6);
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				min-height: 100%;
			}
			body {
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
				background: var(--background);
				color: var(--foreground);
				font: 0.8125rem/1.5 'Geist Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			.card {
				width: 100%;
				max-width: 24rem;
				padding: 2rem 1.5rem;
				text-align: center;
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: 1rem;
				box-shadow: var(--shadow);
			}
			.logo {
				width: 3rem;
				height: 3rem;
				display: block;
				margin: 0 auto 1rem;
			}
			h1 {
				margin: 0 0 0.375rem;
				font-size: 1rem;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			h1 span {
				color: var(--primary);
			}
			p {
				margin: 0 0 1.25rem;
				color: var(--muted-foreground);
			}
			button {
				min-height: 2.75rem;
				padding: 0 1.25rem;
				border: 0;
				border-radius: 0.75rem;
				font: inherit;
				font-weight: 500;
				color: oklch(98.5% 0 0);
				cursor: pointer;
				background: linear-gradient(var(--primary-solid-top), var(--primary-solid-bottom));
				box-shadow:
					0 0 0 1px var(--primary-solid-edge),
					inset 0 1px 0 oklch(100% 0 0 / 0.18);
			}
			button:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: 2px;
			}
			small {
				display: block;
				margin-top: 1rem;
				font-size: 0.6875rem;
				color: var(--muted-foreground);
			}
		</style>
		<script>
			try {
				const t = localStorage.getItem('ocm-theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				else if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
			} catch {}
			document.querySelector('meta[name=theme-color]').content = document.documentElement.dataset.theme === 'light' ? '#fbfaff' : '#0b0a10';
		</script>
	</head>
	<body>
		<main class="card" data-testid="offline">
			<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" /><stop offset="1" stop-color="#6d28d9" /></linearGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22" /><stop offset=".5" stop-color="#fff" stop-opacity="0" /></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#f)" /><rect width="32" height="32" rx="9" fill="url(#s)" /><rect x="14.3" y="2.8" width="3.4" height="3.4" rx=".8" fill="#fff" fill-opacity=".7" /><rect x="9.5" y="5.8" width="13" height="6.4" rx="1.6" fill="#fff" /><path d="M12.3 12.2h7.4l-2.5 3.6h-2.4Z" fill="#fff" /><g stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M7.6 19.6h8.4" /><path d="M7.6 23.4h16.8" stroke-opacity=".72" /><path d="M7.6 27.2h16.8" stroke-opacity=".45" /></g></svg>
			<h1>octo<span>·</span>modern is out of reach</h1>
			<p>The server can’t be reached right now. Check your connection or VPN; this page tries again when you’re back online.</p>
			<button type="button" onclick="location.reload()">Try again</button>
			<small>Nothing is cached offline: printer state, cameras and controls need the server.</small>
		</main>
		<script>
			addEventListener('online', () => location.reload());
		</script>
	</body>
</html>
