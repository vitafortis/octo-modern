# octo·modern — default deployment.
#
#   docker compose up -d
#   open http://<this-host>:3040 and create the admin account
#
services:
  octo-modern:
    image: ghcr.io/vitafortis/octo-modern:latest
    container_name: octo-modern
    restart: unless-stopped
    ports:
      - "3040:3000"
    environment:
      # Time zone for ETAs and logs.
      TZ: Etc/UTC
      # Optional: let Discover find OctoPrint containers through the read-only
      # socket proxy below (uncomment it and depends_on too):
      # OCM_DOCKER_HOSTS: tcp://docker-proxy:2375
      # Optional: an Arcane instance for Discover (read-only key with
      # environments:list, containers:list, containers:read), or connect it in the UI:
      # OCM_ARCANE_URL: http://arcane.lan:3552
      # OCM_ARCANE_API_KEY: ${OCM_ARCANE_API_KEY}
      # Optional: create the first admin here instead of in the setup wizard.
      # OCM_ADMIN_EMAIL: you@example.com
      # OCM_ADMIN_PASSWORD: ${OCM_ADMIN_PASSWORD}
      # Optional: manage the API-key encryption key yourself.
      # Otherwise a random key is generated at /data/secret.key — back it up.
      # OCM_SECRET_KEY: change-me-to-a-long-random-string
      # Single sign-on can be set up in the UI (Integrations); these are optional:
      # OCM_OIDC_ISSUER: https://auth.example.com/application/o/octo-modern/
      # OCM_OIDC_CLIENT_ID: octo-modern
      # OCM_OIDC_CLIENT_SECRET: ${OCM_OIDC_CLIENT_SECRET}
      # OCM_OIDC_NAME: Authentik
      # OCM_OIDC_AUTO_CREATE: "*@example.com"
      # OCM_OIDC_ADMIN_EMAILS: you@example.com
      # OCM_OIDC_DEFAULT_ROLE: viewer
      # Behind a TLS reverse proxy, uncomment so secure cookies and SSO callbacks work:
      # PROTOCOL_HEADER: x-forwarded-proto
      # HOST_HEADER: x-forwarded-host
    volumes:
      - octo-modern-data:/data
      # Library (print G-code from your NAS): mount a share (see volumes below), then add
      # a "Folder" source at /library under Library → Sources. Add :ro to keep it read-only.
      # - nas-library:/library
    extra_hosts:
      # Lets octo·modern reach an OctoPrint published on the Docker host itself.
      - host.docker.internal:host-gateway
    # depends_on:
    #   - docker-proxy
    # mDNS discovery (OctoPi announcing itself) only works on the LAN itself:
    # network_mode: host, or a macvlan network. On this bridge, use Discover's subnet scan.

  # Optional, for Discover: a read-only Docker API, so octo·modern never gets the raw
  # socket. It only lists and inspects containers; POST=0 keeps every write blocked.
  # docker-proxy:
  #   image: tecnativa/docker-socket-proxy:latest
  #   container_name: octo-modern-docker-proxy
  #   restart: unless-stopped
  #   environment:
  #     CONTAINERS: 1
  #     POST: 0
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  octo-modern-data:
  # NAS share for the Library, mounted by Docker itself (nothing to mount on the host).
  # The container runs as uid 1000; it only needs read access unless you allow writing.
  # NFS:
  # nas-library:
  #   driver: local
  #   driver_opts:
  #     type: nfs
  #     o: addr=nas.lan,ro,nfsvers=4
  #     device: ":/volume1/3d/gcode"
  # SMB / CIFS:
  # nas-library:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     o: addr=nas.lan,username=printer,password=${NAS_PASSWORD},uid=1000,gid=1000,vers=3.0,ro
  #     device: //nas.lan/3d/gcode
