name: Android app

# Builds the Android app (android-app/).
#   pull request touching android-app/  -> unit tests + debug APK (artifact)
#   tag android-v1.2.3                  -> release APK 1.2.3, attached to a GitHub Release
#   manual run                          -> release APK (artifact; version from the input)
# Signing comes from the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them the "release" APK is signed with a
# throwaway debug key (installs fine, but can't update an install signed with the real key).
on:
  push:
    tags: ['android-v*']
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 0.2.0); empty: 0.0.<run number>'
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: android-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: android-app/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cap sync android

      - name: Version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${REF_NAME#android-v}"
          elif [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"
          else v="0.0.${{ github.run_number }}"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$v" >> "$GITHUB_ENV"
          # Version codes must only grow: the run number does.
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: android-app/android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK (pull requests)
        if: github.event_name == 'pull_request'
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Release APK
        if: github.event_name != 'pull_request'
        working-directory: android-app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::warning::No signing secrets: the APK is signed with a debug key"; fi
          ./gradlew --no-daemon assembleRelease
          cd app/build/outputs/apk/release
          mv octo-modern-*-release.apk "octo-modern-${APP_VERSION_NAME}.apk"
          sha256sum "octo-modern-${APP_VERSION_NAME}.apk" > "octo-modern-${APP_VERSION_NAME}.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: octo-modern-android-${{ steps.version.outputs.name }}
          path: |
            android-app/android/app/build/outputs/apk/debug/*.apk
            android-app/android/app/build/outputs/apk/release/*.apk
            android-app/android/app/build/outputs/apk/release/*.sha256
          if-no-files-found: error

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        working-directory: android-app/android/app/build/outputs/apk/release
        run: |
          notes="octo·modern for Android ${VERSION}. Install the APK on your phone (allow installing apps from your browser or file manager), then enter your server's address. See the README's Android app section."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Android app ${VERSION}" --notes "$notes" --latest=false
          gh release upload "$TAG" "octo-modern-${VERSION}.apk" "octo-modern-${VERSION}.apk.sha256" --clobber
